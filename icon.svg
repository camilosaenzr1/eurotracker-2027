<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e0a"/>
      <stop offset="50%" stop-color="#121a13"/>
      <stop offset="100%" stop-color="#1e2b1d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b38e22"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#d4af37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>

  <!-- Compass Outer Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#goldGlow)"/>
  <circle cx="256" cy="256" r="148" fill="rgba(30, 43, 29, 0.4)" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.3"/>

  <!-- Compass Star / Needle -->
  <g transform="translate(256, 256)" filter="url(#goldGlow)">
    <!-- North Needle (Gold) -->
    <polygon points="0,-130 22,-20 0,0" fill="url(#goldGrad)"/>
    <polygon points="0,-130 -22,-20 0,0" fill="#fef08a"/>
    <!-- South Needle (Emerald) -->
    <polygon points="0,130 22,20 0,0" fill="url(#emeraldGrad)"/>
    <polygon points="0,130 -22,20 0,0" fill="#10b981"/>
    <!-- East / West Points -->
    <polygon points="100,0 20,-14 0,0" fill="url(#goldGrad)" opacity="0.8"/>
    <polygon points="-100,0 -20,-14 0,0" fill="#fef08a" opacity="0.8"/>
    
    <!-- Center Pivot Pin -->
    <circle cx="0" cy="0" r="16" fill="#090e0a" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- Euro Badge -->
  <g transform="translate(196, 400)">
    <rect x="0" y="0" width="120" height="34" rx="17" fill="#090e0a" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="60" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#f3e5ab" text-anchor="middle" letter-spacing="1.5">
      EURO 2027
    </text>
  </g>
</svg>
